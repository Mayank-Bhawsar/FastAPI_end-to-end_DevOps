apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-gitops-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mayank-Bhawsar/FastAPI_end-to-end_DevOps.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true