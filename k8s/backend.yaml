apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: default
  labels:
    app: fastapi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: fastapi-backend
          image: 324330564368.dkr.ecr.ap-south-1.amazonaws.com/staging-fastapi-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: POSTGRES_SERVER
              value: "staging-postgres.cb28yy0gmyxh.ap-south-1.rds.amazonaws.com"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "fastapidb"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-db-credentials
                  key: password
            - name: FIRST_SUPERUSER
              value: "admin@example.com"
            - name: FIRST_SUPERUSER_PASSWORD
              value: "AdminSecurePassword123!"

            - name: PROJECT_NAME
              value: "FastAPI_end-to-end Staging"
            - name: BACKEND_CORS_ORIGINS
              value: "http://localhost,http://localhost:80"
            - name: SECRET_KEY
              value: "super_secret_jwt_token_key_12345"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      imagePullSecrets:
        - name: ecr-regcred
---

apiVersion: v1
kind: Service
metadata:
  name: fastapi-backend-service
  namespace: default
  labels:
    app: fastapi-backend
spec: 
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app: fastapi-backend
