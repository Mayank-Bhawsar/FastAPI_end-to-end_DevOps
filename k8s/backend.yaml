apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: default
  labels:
    app: fastapi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      containers:
        - name: fastapi-backend
          image: 324330564368.dkr.ecr.ap-south-1.amazonaws.com/staging-fastapi-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: DATABASE_URL
              value: "postgresql://postgres:iWXyQY2j@staging-postgres.cb28yy0gmyxh.ap-south-1.rds.amazonaws.com:5432/fastapidb"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: fastapi-backend-service
  namespace: default
spec: 
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: fastapi-backend
