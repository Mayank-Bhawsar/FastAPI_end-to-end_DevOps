apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fastapi-backend-netpolicy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: fastapi-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: fastapi-frontend
    ports:
    - protocol: TCP
      port: 8000

  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8000